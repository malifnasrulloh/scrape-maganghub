name: Scrape MagangHub

on:
  # schedule:
    # Run every 1 hours
    - cron: "0 */1 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # 🧾 Checkout repository
      - uses: actions/checkout@v4

      # ⚙️ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 💾 Cache Python dependencies for faster installs
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 📦 Install dependencies
      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt

      # 🕷️ Run scraper script
      - name: Run scraper
        run: python scraper.py

      # 🧠 Check for changes before committing
      - name: Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Add only data files
          git add data.json.gz raw_data.json.gz

          # Only commit if there are changes
          if ! git diff --cached --quiet; then
            timestamp=$(date -u +"%Y-%m-%d %H:%M UTC")
            sed -i "s|Data terakhir diperbarui pada:.*|Data terakhir diperbarui pada: $timestamp|g" app.py
            git add app.py
            git commit -m "✨ Auto-update lowongan magang — $timestamp [skip ci]"
            git push
          else
            echo "No data changes — skipping commit."
          fi